# Test della regia e dell'agente, con fixture finte: nessuna rete, nessun segreto.
name: test
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['siti/**', 'stato/**', 'vps/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - run: node --test 'test/*.test.mjs'
      - run: python3 -m unittest discover -s test -p '*_test.py' -v
      - name: actionlint
        run: |
          bash <(curl -fsS https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP" > /dev/null
          "$RUNNER_TEMP/actionlint" -color
